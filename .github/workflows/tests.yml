name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run API scenarios
        run: python scripts/run_tests.py
      - name: Verify log redaction
        run: python scripts/verify_redaction.py
      - name: Upload HTML report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            reports/
            logs/
          retention-days: 7
